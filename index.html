<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hud">
    <div class="hud__section">
      <h1>킹덤 배틀: 오리진</h1>
      <p class="hud__subtitle">고블린, 오크, 오크왕을 막아내세요!</p>
    </div>
    <div class="hud__section hud__stats">
      <div>골드: <span id="gold">0</span></div>
      <div>생명력: <span id="lives">0</span></div>
      <div>웨이브: <span id="wave">0</span></div>
    </div>
    <div class="hud__section hud__controls">
      <button id="start">게임 시작</button>
      <button id="toggle-music">🎵 BGM 켜기</button>
      <button id="toggle-sfx">🔊 효과음 켜기</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>타워 배치</h2>
      <div class="tower-buttons">
        <button class="tower-btn" data-type="archer">하늘매 궁수탑 (100)</button>
        <button class="tower-btn" data-type="barracks">라이언하트 병영 (120)</button>
        <button class="tower-btn" data-type="mage">아케인 스파이어 (140)</button>
        <button class="tower-btn" data-type="bomb">블래스트포지 포탄탑 (150)</button>
      </div>
      <p class="hint">타워 슬롯을 클릭해 배치하거나 업그레이드하세요. 업그레이드는 비용을 소모합니다.</p>
    </section>

    <canvas id="game" width="960" height="600"></canvas>
  </main>

  <section class="legend">
    <h3>적 정보</h3>
    <ul>
      <li>고블린: 빠른 이동 속도, 낮은 체력</li>
      <li>오크: 느린 속도, 높은 체력</li>
      <li>오크왕: 보스, 강력한 체력과 보상</li>
    </ul>
  </section>

  <script src="src/main.js"></script>
</body>
</html>
